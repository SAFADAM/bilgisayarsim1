name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Proje kodlarını GitHub Actions ortamına çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js ortamını kur
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java JDK 17 ortamını kur (Android Gradle için gerekli)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Proje bağımlılıklarını kur
      - name: Install Dependencies
        run: |
          npm install

      # 5. Capacitor ve Android platformunu yükle/güncelle
      - name: Add and Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 6. gradlew dosyasına çalıştırma izni ver ve APK'yı derle
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 7. Oluşturulan APK dosyasını Artifacts olarak yükle
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
